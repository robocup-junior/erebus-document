name: Deploy

on:
  push:
    branches:
      - master
      - release/v*
      - '!release/v2[0-5]' # v25 and earlier are frozen Hugo sites
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # "Last updated" dates come from the git history
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Choose the site for this branch
        run: |
          if [ "$GITHUB_REF_NAME" = master ]; then
            worker=erebus-document
            domain=erebus.rcj.cloud
          else
            version=${GITHUB_REF_NAME#release/}
            worker=erebus-docs-$version
            domain=$version.erebus.rcj.cloud
            echo "PUBLIC_ARCHIVED_VERSION=$version" >> "$GITHUB_ENV"
          fi
          echo "WORKER=$worker" >> "$GITHUB_ENV"
          echo "SITE_URL=https://$domain" >> "$GITHUB_ENV"
          if [ "$BIND_DOMAINS" = true ]; then
            echo "DOMAIN_OPTION=--domain=$domain" >> "$GITHUB_ENV"
          fi
        env:
          BIND_DOMAINS: ${{ vars.BIND_DOMAINS }}
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx wrangler deploy --name="$WORKER" $DOMAIN_OPTION
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
